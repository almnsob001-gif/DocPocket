name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev libltdl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools==69.5.1 wheel
          python -m pip install "Cython==0.29.36" buildozer

      - name: Build APK
        run: |
          # هذا السطر يمسح متغيرات أندرويد الخاصة بالخادم ليجبر Buildozer على تحميل نسخته الخاصة
          unset ANDROID_HOME ANDROID_NDK_HOME ANDROID_NDK ANDROID_SDK_ROOT
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MedCalcHub-APK
          path: bin/*.apk
          if-no-files-found: error
